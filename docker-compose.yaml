---
services:
  app84:
    build:
      context: .
      args:
        PHP_VERSION: "8.4"
    environment:
      PHP_IDE_CONFIG: 'serverName=icanboogie-icanboogie'
    volumes:
      - .:/app:delegated
      - composer-cache:/opt/composer/cache
    working_dir: /app

  app85:
    build:
      context: .
      args:
        PHP_VERSION: "8.5"
    environment:
      PHP_IDE_CONFIG: 'serverName=icanboogie-icanboogie'
    volumes:
      - .:/app:delegated
      - composer-cache:/opt/composer/cache
    working_dir: /app

volumes:
  composer-cache: ~
